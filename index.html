<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Blog Tech</title>
  <style>
    :root {
      --bg-color: #f4f4f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #0066cc;
      --button-hover: #004b99;
      --border-color: #dddddd;
    }

    [data-theme="dark"] {
      --bg-color: #1e1e2e;
      --card-bg: #2a2a3c;
      --text-color: #e0e0e0;
      --primary-color: #66b2ff;
      --button-hover: #3399ff;
      --border-color: #444455;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 800px;
      margin: 0 auto 30px auto;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
    }

    .theme-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .theme-btn:hover {
      background-color: var(--button-hover);
    }

    main {
      max-width: 800px;
      margin: 0 auto;
    }

    .post {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .post img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 15px 0;
    }

    .post h2 {
      margin-bottom: 10px;
    }

    .action-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    .action-btn:hover {
      background-color: var(--button-hover);
    }
  </style>
</head>
<body>

  <header>
    <h1>Meu Blog</h1>
    <button class="theme-btn" id="themeToggle">Modo Escuro</button>
  </header>

  <main>
    <article class="post">
      <h2>Primeiro Post do Blog</h2>
      <p>Bem-vindo ao meu novo blog! Este é um exemplo simples utilizando apenas HTML, CSS e JavaScript puro.</p>
      <img src="https://picsum.photos/800/400" alt="Imagem de capa do post">
      <p>Abaixo você pode interagir com o botão de leitura:</p>
      <button class="action-btn" onclick="alert('Obrigado por ler o post!')">Curtir Post</button>
    </article>
  </main>

  <script>
    const themeToggleBtn = document.getElementById('themeToggle');
    
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      
      if (currentTheme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        themeToggleBtn.textContent = 'Modo Escuro';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggleBtn.textContent = 'Modo Claro';
      }
    });
  </script>

</body>
</html>
